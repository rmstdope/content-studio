<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Copy another image — every state</title>
    <style>
      :root {
        --bg: #06070c;
        --edge: rgb(255 255 255 / 8%);
        --glass: rgb(255 255 255 / 3.5%);
        --glass-strong: rgb(255 255 255 / 6%);
        --text: #eceef3;
        --text-soft: #c7ccd6;
        --muted: #a9b0bd;
        --faint: #8a91a0;
        --accent: #ff6b2c;
        --accent-ink: #1a0a02;
        --accent-soft-bg: #2a1b12;
        --accent-soft-ink: #ff9a6b;
        --ok: #3ddc97;
        --panel: #10121a;
        --inset: #0d0f14;
        --chip: #1a1d26;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background:
          radial-gradient(900px 500px at 85% -10%, rgb(255 90 120 / 12%), transparent 60%),
          var(--bg);
        color: var(--text);
        font:
          14px/1.45 system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
      }
      .demo {
        flex: none;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        align-items: center;
        padding: 8px 16px;
        background: #1d1426;
        border-bottom: 1px solid #4a2d5c;
        font-size: 12.5px;
        color: #e4cdf0;
      }
      .demo b {
        color: #fff;
      }
      .demo button {
        font: inherit;
        font-size: 12px;
        background: rgb(255 255 255 / 6%);
        color: #e4cdf0;
        border: 1px solid #4a2d5c;
        border-radius: 999px;
        padding: 3px 10px;
        cursor: pointer;
      }
      .demo button[aria-pressed='true'] {
        background: #4a2d5c;
        color: #fff;
      }
      .app {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .rail {
        flex: 0 0 72px;
        border-right: 1px solid var(--edge);
        background: rgb(10 11 18 / 55%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding-top: 14px;
        color: var(--faint);
        font-size: 10.5px;
      }
      .rail .logo {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: linear-gradient(135deg, #ff7a3d, #ff4f8b);
      }
      .rail .on {
        color: var(--text);
      }
      main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        padding: 14px 20px 14px;
        overflow: auto;
      }
      .crumbs {
        color: var(--faint);
        font-size: 12px;
      }
      h2 {
        margin: 2px 0 8px;
        font-size: 19px;
      }
      h2 .id {
        color: var(--faint);
        font:
          12px ui-monospace,
          Menlo,
          monospace;
        margin-left: 8px;
        font-weight: 400;
      }
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--edge);
        margin-bottom: 12px;
      }
      .tabs span {
        padding: 6px 12px;
        color: var(--muted);
        border-bottom: 2px solid transparent;
      }
      .tabs .on {
        color: var(--text);
        border-color: var(--accent);
      }
      .tabs kbd,
      .kbd {
        font:
          11px ui-monospace,
          Menlo,
          monospace;
        border: 1px solid var(--edge);
        border-radius: 4px;
        padding: 0 4px;
        color: var(--faint);
        margin-left: 4px;
      }
      h3 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--faint);
        margin: 0 0 6px;
        font-weight: 600;
      }
      .band {
        flex: none;
        display: grid;
        gap: 14px;
        margin-bottom: 12px;
      }
      .band.row {
        grid-template-columns: minmax(0, 1fr) 360px;
      }
      .band.stack {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .box {
        background: var(--glass);
        border: 1px solid var(--edge);
        border-radius: 12px;
        padding: 10px 12px;
      }
      .field {
        background: var(--inset);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 7px 9px;
        color: var(--text-soft);
        min-height: 54px;
      }
      .stack .field {
        min-height: 40px;
      }
      .line {
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 7px;
        color: var(--text-soft);
        font-size: 13px;
      }
      .line .fold {
        color: var(--muted);
      }
      .sel {
        background: var(--chip);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 5px 9px;
        color: var(--text-soft);
        white-space: nowrap;
      }
      .btn {
        background: var(--glass-strong);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 5px 11px;
        color: var(--text);
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
      }
      .btn.pri {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
        font-weight: 600;
      }
      .btn.pri .kbd {
        color: var(--accent-ink);
        border-color: rgb(0 0 0 / 25%);
      }
      .hint {
        color: var(--faint);
        font-size: 12px;
      }
      .row-gap {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .mk {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .stack .mk {
        flex-direction: row;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }
      .stack .mk .sp {
        flex: 1;
      }

      /* Stage */
      .stage {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .fit-window .stage {
        flex: 1 1 auto;
        min-height: 160px;
      }
      .fit-width .stage {
        flex: none;
      }
      .side {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }
      .track {
        flex: 1;
        min-height: 0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      .fit-window .track {
        container-type: size;
      }
      .pic {
        border-radius: 6px;
        overflow: hidden;
        background: #12151f;
        border: 1px solid var(--edge);
        position: relative;
        aspect-ratio: var(--ratio);
      }
      .fit-window .pic {
        width: min(100cqw, calc(100cqh * var(--ratio)), var(--own));
      }
      .fit-width .pic {
        width: min(100%, var(--own));
      }
      .pic svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .pic .size {
        position: absolute;
        right: 6px;
        bottom: 6px;
        font:
          11px ui-monospace,
          Menlo,
          monospace;
        background: rgb(0 0 0 / 55%);
        padding: 1px 5px;
        border-radius: 4px;
        color: #ddd;
      }
      .empty {
        display: grid;
        place-items: center;
        color: var(--muted);
        text-align: center;
        padding: 20px;
        border: 1px dashed var(--edge);
      }
      .cap-above .under {
        margin: 0 0 7px;
        min-height: 30px;
      }
      .under {
        flex: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-top: 7px;
        flex-wrap: wrap;
        font-size: 13px;
      }
      .chip {
        font-size: 11px;
        border-radius: 999px;
        padding: 1px 7px;
        background: var(--accent-soft-bg);
        color: var(--accent-soft-ink);
        margin-left: 4px;
      }

      /* Strip */
      .strip {
        flex: none;
        display: flex;
        gap: 8px;
        align-items: flex-end;
        overflow-x: auto;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--edge);
      }
      .strip h3 {
        writing-mode: horizontal-tb;
        align-self: center;
        margin: 0 6px 0 0;
        white-space: nowrap;
      }
      .thumb {
        flex: none;
        width: 112px;
        font-size: 11px;
        color: var(--muted);
      }
      .thumb .p {
        aspect-ratio: var(--ratio);
        border-radius: 5px;
        overflow: hidden;
        border: 2px solid transparent;
        background: #12151f;
      }
      .thumb.portrait-t {
        width: 66px;
      }
      .thumb .p svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .thumb.on .p {
        border-color: var(--accent);
      }
      .thumb.chosen .p {
        border-color: var(--ok);
      }
      .thumb.making .p {
        display: grid;
        place-items: center;
        color: var(--faint);
        border: 1px dashed var(--edge);
      }

      .app {
        min-height: 100vh;
      }
      .or {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-top: 8px;
        margin-top: 2px;
        border-top: 1px dashed var(--edge);
      }
      .copybox .mk {
        gap: 9px;
      }
      .band.three {
        grid-template-columns: minmax(0, 1fr) 340px 300px;
      }
      .scrim {
        position: fixed;
        inset: 0;
        background: rgb(0 0 0/55%);
        display: grid;
        place-items: center;
        z-index: 5;
      }
      .dlg {
        width: min(760px, calc(100vw - 32px));
        max-height: calc(100vh - 60px);
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 14px;
        box-shadow: 0 20px 60px rgb(0 0 0/60%);
      }
      .dlg header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--edge);
      }
      .dlg header b {
        font-size: 15px;
      }
      .dlg .body {
        padding: 12px 16px;
        overflow: auto;
      }
      .dlg footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-top: 1px solid var(--edge);
        flex-wrap: wrap;
      }
      .search {
        background: var(--inset);
        border: 1px solid var(--accent);
        border-radius: 8px;
        padding: 6px 9px;
        color: var(--faint);
        margin-bottom: 10px;
      }
      .act {
        margin: 10px 0 6px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--faint);
        font-weight: 600;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 10px;
      }
      .cell {
        font-size: 12px;
        color: var(--text-soft);
      }
      .cell .p {
        aspect-ratio: 4/3;
        border-radius: 6px;
        overflow: hidden;
        border: 2px solid transparent;
        background: #12151f;
      }
      .cell .p svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .cell.sel2 .p {
        border-color: var(--accent);
      }
      .cell .m {
        color: var(--faint);
        font-size: 11px;
      }
      .cell.off {
        opacity: 0.45;
      }
      .warn {
        color: #f5c26b;
        font-size: 11px;
      }
      .pop {
        position: absolute;
        z-index: 5;
        width: 360px;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
        box-shadow: 0 14px 40px rgb(0 0 0/60%);
        padding: 8px;
      }
      .pop .rowi {
        display: flex;
        gap: 9px;
        align-items: center;
        padding: 5px 6px;
        border-radius: 6px;
        font-size: 13px;
      }
      .pop .rowi.hi {
        background: var(--accent-soft-bg);
      }
      .pop .rowi .t {
        width: 44px;
        aspect-ratio: 4/3;
        border-radius: 4px;
        overflow: hidden;
        flex: none;
      }
      .pop .rowi .t svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .pop .rowi .m {
        color: var(--faint);
        font-size: 11px;
        display: block;
      }
      .pop .grp {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--faint);
        padding: 6px 6px 2px;
      }
      .anchor {
        position: relative;
      }
      .ok {
        color: var(--ok);
      }
      .err {
        color: #ff7b7b;
      }
      .from {
        color: var(--faint);
        font-size: 12px;
        margin-left: 6px;
      }
      .thumb .src {
        display: block;
        color: var(--faint);
        font-size: 10px;
      }
      .callout {
        background: #1d1426;
        border: 1px solid #4a2d5c;
        color: #e4cdf0;
        border-radius: 10px;
        padding: 9px 12px;
        font-size: 12.5px;
        margin: 0 0 12px;
      }
      .callout b {
        color: #fff;
      }
      @media (max-width: 1000px) {
        .band.row,
        .band.three {
          grid-template-columns: 1fr;
        }
        .stage {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body class="fit-width cap-above">
    <div class="demo">
      <b>Drawing — Copy another image — every state</b><span>Show:</span><span id="states"></span>
    </div>
    <div class="app">
      <aside class="rail">
        <div class="logo"></div>
        <span>Narration</span><span>Music</span><span class="on">Images</span><span>Effects</span
        ><span>Scenes</span>
      </aside>
      <main id="main"></main>
    </div>
    <div id="layer"></div>
    <script>
      const CONF = {
        title: 'Copy another image \u2014 every state',
        entry: 'button',
        picker: 'dialog',
        shape: 'mark',
        states: [
          ['closed', 'Before'],
          ['open', 'Picking'],
          ['copying', 'Copying'],
          ['copied', 'Copied'],
          ['none', 'No other image has a picture'],
          ['failed', 'Copy failed'],
        ],
        callout: null,
      }
      const STATES = CONF.states
      let st = STATES[0][0]
      function lantern(lit, bg = '#1b1f2e') {
        return `<svg viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice"><rect width="160" height="120" fill="${bg}"/>
  ${lit ? '<circle cx="80" cy="66" r="46" fill="#ffb347" opacity=".18"/><circle cx="80" cy="66" r="26" fill="#ffd27a" opacity=".25"/>' : ''}
  <rect x="0" y="98" width="160" height="22" fill="#2a2218"/>
  <path d="M70 30 q10 -12 20 0" stroke="#8a7a5a" stroke-width="2.4" fill="none"/>
  <rect x="66" y="34" width="28" height="6" rx="2" fill="#6b5a3a"/>
  <rect x="68" y="40" width="24" height="44" rx="3" fill="${lit ? '#ffe2a0' : '#3a4256'}" opacity="${lit ? '.95' : '.8'}" stroke="#6b5a3a" stroke-width="2"/>
  ${lit ? '<path d="M80 72 q-6 -8 0 -18 q6 10 0 18z" fill="#ff8a2a"/>' : '<rect x="78" y="62" width="4" height="12" fill="#ddd"/>'}
  <rect x="64" y="84" width="32" height="8" rx="2" fill="#6b5a3a"/></svg>`
      }
      function other(k) {
        const c = ['#2b3a6b', '#3a2b4a', '#233d33', '#4a3324', '#2d2d3d', '#1f3a4a'][k % 6]
        return `<svg viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice"><rect width="160" height="120" fill="${c}"/><rect y="80" width="160" height="40" fill="#141820"/><circle cx="${30 + ((k * 23) % 100)}" cy="34" r="9" fill="#e8d3a0" opacity=".7"/><rect x="${20 + ((k * 37) % 110)}" y="48" width="18" height="32" fill="#8a8070"/></svg>`
      }
      const IMAGES = [
        [
          'Act I: The Lantern',
          [
            ['Lantern', 'lantern', 1, '640 × 480'],
            ['Cellar door', 'cellar-door', 2, '640 × 480'],
            ['Old map', 'old-map', 3, '640 × 480'],
            ['Village square', 'village-square', 4, '1280 × 720', 'wide'],
            ['Lantern (lit)', 'lantern-lit', -1, '640 × 480', 'self'],
          ],
        ],
        [
          'Act II: The Road',
          [
            ['Crossroads', 'crossroads', 5, '640 × 480'],
            ['Inn sign', 'inn-sign', 0, '480 × 640', 'tall'],
            ['Toll bridge', 'toll-bridge', 6, '—', 'nopic'],
          ],
        ],
      ]
      function pic(inner, empty) {
        return `<div class="pic${empty ? ' empty' : ''}" style="--ratio:4/3;--own:640px">${inner}${empty ? '' : '<span class="size">640 × 480</span>'}</div>`
      }
      function makeBox() {
        const none = st === 'none'
        const copyBtn =
          CONF.entry === 'button'
            ? `<div class="or"><span class="hint">or</span><span class="anchor"><span class="btn" id="copybtn" ${none || st === 'copying' ? 'style="opacity:.45"' : ''}>${st === 'copying' ? 'Copying…' : 'Copy another image…'}</span>${CONF.picker === 'menu' && st === 'open' ? menuPop() : ''}</span><span class="hint">${none ? 'No other image has a picture yet.' : 'No model, nothing spent'}</span></div>`
            : ''
        return `<div class="box"><h3>Make takes</h3><div class="mk">
    <span class="sel">FLUX.2 klein · about 20 s a take ▾</span>
    <span class="row-gap"><span class="sel">4 ▾</span><span class="btn pri">Make 4 takes</span><span class="hint">1 to 10 at a time · about 1 min 20 s for 4</span></span>
    ${copyBtn}
    <span class="row-gap"><label><input type="checkbox" checked /> What the game gets</label><span class="hint"><span class="kbd">←</span><span class="kbd">→</span> takes · <span class="kbd">C</span> choose · <span class="kbd">D</span> drop</span></span></div></div>`
      }
      function copyPanel() {
        const none = st === 'none'
        return `<div class="box copybox"><h3>Copy another image</h3><div class="mk">
    <span class="anchor"><span class="sel" style="display:block">${st === 'open' || st === 'copied' || st === 'failed' ? 'Lantern · Act I' : none ? 'No other image has a picture yet' : 'Pick an image…'} ▾</span>${st === 'open' ? menuPop() : ''}</span>
    <span class="row-gap"><span class="btn pri" ${none || st === 'closed' ? 'style="opacity:.45"' : ''}>Copy as a take</span><span class="hint">No model, nothing spent</span></span>
    <span class="hint">Its picture only: patches and named areas stay with it.</span></div></div>`
      }
      function shown(img) {
        if (img[4] === 'self' || img[4] === 'nopic') return false
        if (CONF.shape === 'hide' && (img[4] === 'wide' || img[4] === 'tall')) return false
        return true
      }
      function hiddenLine() {
        return CONF.shape === 'hide'
          ? '<div class="hint" style="margin-top:8px">2 images of another shape are not listed: a copy must be 640 × 480 like this one.</div>'
          : ''
      }
      function shapeNote(img) {
        if (CONF.shape !== 'mark') return ''
        if (img[4] === 'wide')
          return '<span class="warn">1280 × 720 · will be cropped to fit</span>'
        if (img[4] === 'tall') return '<span class="warn">480 × 640 · will be cropped to fit</span>'
        return ''
      }
      function menuPop() {
        let rows = ''
        for (const [act, imgs] of IMAGES) {
          const list = imgs.filter(shown)
          if (!list.length) continue
          rows +=
            `<div class="grp">${act}</div>` +
            list
              .map(
                (i) =>
                  `<div class="rowi ${i[1] === 'lantern' ? 'hi' : ''}"><span class="t">${i[2] === 1 ? lantern(false) : other(i[2])}</span><span>${i[0]}<span class="m">${shapeNote(i) || 'Take ' + (3 + i[2]) + ' · ' + i[3]}</span></span></div>`,
              )
              .join('')
        }
        return `<div class="pop" style="top:34px;left:0"><div class="search" style="margin-bottom:6px">Find an image…</div>${rows}${hiddenLine()}</div>`
      }
      function dialog() {
        const noneD = st === 'none'
        let body = ''
        if (noneD)
          body =
            '<div class="hint" style="padding:30px;text-align:center">No other image in the game has a picture yet. Choose a take on another image first.</div>'
        else
          for (const [act, imgs] of IMAGES) {
            const list = imgs.filter(shown)
            if (!list.length) continue
            body +=
              `<div class="act">${act}</div><div class="grid">` +
              list
                .map(
                  (i) =>
                    `<div class="cell ${i[1] === 'lantern' ? 'sel2' : ''}"><div class="p">${i[2] === 1 ? lantern(false) : other(i[2])}</div>${i[0]}<div class="m">${shapeNote(i) || 'Take ' + (3 + i[2]) + ' in the game'}</div></div>`,
                )
                .join('') +
              '</div>'
          }
        return `<div class="scrim"><div class="dlg" role="dialog"><header><b>Copy another image into Lantern (lit)</b><span class="btn">✕</span></header>
  <div class="body"><div class="search">Find an image…</div>${body}${noneD ? '' : hiddenLine()}</div>
  <footer><span class="hint">${noneD ? '' : 'Lantern · Take 4 — its picture only. Its patches and named areas stay with it.'}</span><span class="row-gap"><span class="btn">Cancel</span><span class="btn pri" ${noneD ? 'style="opacity:.45"' : ''}>Copy as a take</span></span></footer></div></div>`
      }
      function render() {
        document.getElementById('states').innerHTML = STATES.map(
          ([k, l]) => `<button data-s="${k}" aria-pressed="${k === st}">${l}</button>`,
        ).join(' ')
        const copied = st === 'copied'
        const failed = st === 'failed'
        const band =
          CONF.entry === 'panel'
            ? `<div class="band three"><div class="box"><h3>Prompt</h3><div class="field">The lantern from the cellar, now lit: a warm flame inside the glass.</div></div>${makeBox()}${copyPanel()}</div>`
            : `<div class="band row"><div class="box"><h3>Prompt</h3><div class="field">The lantern from the cellar, now lit: a warm flame inside the glass.</div><div class="line"><label><input type="checkbox" checked /> Add Act I's style to this image</label><span class="fold">▸ The whole prompt the model gets</span></div></div>${makeBox()}</div>`
        const msg = copied
          ? CONF.after === 'b'
            ? `<div class="ok row-gap" style="margin:-4px 0 10px">Copied Lantern's picture as Take 1. <span class="btn pri">Choose it and fine-tune</span></div>`
            : `<div class="ok" style="margin:-4px 0 10px">Copied Lantern's picture as Take 1. Choose it, then fine-tune it on the Fine-tune tab.</div>`
          : st === 'copying'
            ? `<div class="hint" style="margin:-4px 0 10px">Copying Lantern's picture…</div>`
            : failed
              ? `<div class="err" style="margin:-4px 0 10px">Lantern's picture could not be copied: content-studio/cache/images/lantern-lit.json could not be written. Nothing was added; try again.</div>`
              : ''
        const left = `<div class="side"><div class="under"><span>In the game</span></div><div class="track">${pic('No picture yet', true)}</div></div>`
        const right = copied
          ? `<div class="side"><div class="under"><span>Comparing · <b>Take 1</b><span class="chip">new</span><span class="from">Copied from Lantern · Take 4</span></span><span class="row-gap"><span class="btn">Drop <span class="kbd">D</span></span><span class="btn pri">Choose <span class="kbd">C</span></span></span></div><div class="track">${pic(lantern(false))}</div></div>`
          : `<div class="side"><div class="under"><span>Comparing</span></div><div class="track">${pic('Make takes to compare them here.', true)}</div></div>`
        const strip = copied
          ? `<div class="strip"><h3>Takes · 1</h3><div class="thumb on"><div class="p" style="--ratio:4/3">${lantern(false)}</div>Take 1<span class="src">copied from Lantern</span></div></div>`
          : `<div class="strip"><h3>Takes · 0</h3><span class="hint">No takes yet.</span></div>`
        document.getElementById('main').innerHTML =
          `<div class="crumbs">Images › Act I: The Lantern</div>
   <h2>Lantern (lit) <span class="id">lantern-lit · 640 × 480</span></h2>
   <div class="tabs"><span class="on">Make<kbd>1</kbd></span><span>Fine-tune<kbd>2</kbd></span><span>Named areas<kbd>3</kbd></span><span>Movement<kbd>4</kbd></span></div>
   ${CONF.callout ? `<div class="callout">${CONF.callout}</div>` : ''}${band}${msg}<div class="stage">${left}${right}</div>${strip}`
        document.getElementById('layer').innerHTML =
          CONF.picker === 'dialog' && (st === 'open' || (st === 'none' && CONF.noneOpen))
            ? dialog()
            : ''
        document.querySelectorAll('[data-s]').forEach(
          (b) =>
            (b.onclick = () => {
              st = b.dataset.s
              render()
            }),
        )
      }
      render()
    </script>
  </body>
</html>
