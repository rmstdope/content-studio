# Dependabot opens pull requests that keep Content Studio's dependencies current.
#
# Policy:
# - Minor and patch updates arrive together, once a week, in one grouped pull
#   request per ecosystem. CI is the safety net.
# - Each major update arrives in its own pull request. Read its changelog or
#   migration guide before merging; a major that needs code changes becomes a
#   bead.
# - A release must be at least a few days old before Dependabot proposes it,
#   so a broken release has time to be pulled.
# - Security updates ignore the schedule and the cooldown. Turn them on under
#   Settings → Code security → Dependabot security updates.
#
# Not covered: the Python workers in worker/ declare their dependencies inline
# (PEP 723 script metadata, run with uv), which Dependabot does not read; bump
# those by hand. Bun itself is pinned in ci.yml (bun-version), also by hand.
#
# Nothing here merges on its own: every Dependabot pull request goes through
# the same review and checks as any other change.
version: 2
updates:
  # The studio: its dependencies and dev tools in package.json and bun.lock.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The actions the CI workflow uses.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore(ci)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
