name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Format and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # A pinned build kept in the Actions cache: installing it with apt took 12-22 s on every run.
      - name: Restore ffmpeg
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-ffmpeg.sh') }}

      - name: Install ffmpeg
        run: scripts/ci-ffmpeg.sh "$RUNNER_TEMP/ffmpeg"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The tests that need ffmpeg skip without it, so its absence fails the job here.
      - name: Check ffmpeg is on the path
        run: |
          ffmpeg -hide_banner -version >/dev/null
          ffprobe -hide_banner -version >/dev/null

      # One worker process per core, each test file in its own global.
      - name: Test
        run: bun run test
